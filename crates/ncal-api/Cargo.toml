[package]
name = "ncal-api"
version.workspace = true
edition.workspace = true
description = "HTTP client for Notion Calendar calendar-api.notion.so (internal RPC surface)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["local-credentials"]
local-credentials = ["dep:keyring", "dep:rusty-leveldb", "dep:tempfile"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls", "query"] }
rusty-leveldb = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["linux-native"] }

[package]
name = "ncal-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-independent MCP tools for Notion Calendar"

[dependencies]
ncal-api = { path = "../ncal-api", default-features = false }
ncal-core = { path = "../ncal-core" }
rmcp = { version = "~3.10.0", default-features = false, features = ["server", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "~3.10.0", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["macros", "rt", "io-util", "net"] }
wiremock = "0.6"

[workspace]
resolver = "2"
exclude = ["tools/t"]
members = ["crates/ncal-api", "crates/ncal-core", "crates/ncal-mcp", "crates/ncal", "xtask"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/olegpustovit/ncal"
homepage = "https://github.com/olegpustovit/ncal"
readme = "README.md"
keywords = ["notion", "calendar", "cli", "automation", "agents"]
categories = ["command-line-utilities", "api-bindings"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
